name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.test.cjs && node tests/board.test.cjs && node tests/berries.test.cjs && node tests/auto.test.cjs && node tests/simulation.test.cjs && node tests/maps.test.cjs
      - name: Stage only public application files
        run: |
          mkdir -p _site/licenses
          cp index.html style.css app.js board.js core.js data.js berries.js manifest.webmanifest favicon.ico _site/
          cp -R assets _site/
          cp licenses/*.txt _site/licenses/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
